name: Multiplatform Build & Export (Windows, macOS, Linux)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows Executable
        run: powershell -ExecutionPolicy Bypass -File compile.ps1

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v3
        with:
          name: EternAudio-Windows-x64
          path: EternAudio.exe

  build-crossplatform:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Verify Cross-Platform Compilation
        run: dotnet --version
